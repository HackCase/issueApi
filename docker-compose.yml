services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: issues
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./collector/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issues"]
      interval: 5s
      retries: 10

  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"  # out/ é do usuário do host, não do root
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/issues
    ports:
      - "8000:8000"
    volumes:
      - ./out:/app/out
    depends_on:
      db:
        condition: service_healthy

  collector:
    build: .
    profiles: ["collector"]
    working_dir: /app/collector
    command: python collect.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/issues
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
