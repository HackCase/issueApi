title: Padronizar template de onboarding de membros
body: |
  ## Contexto
  Novos membros recebem orientações diferentes dependendo de quem os recebe, o que atrasa a primeira entrega. Criar um template único de onboarding.

  ## Critérios de aceite
  - [ ] Template publicado no repositório de documentação
  - [ ] Checklist de onboarding aplicado a 100% dos novos membros do próximo ciclo

