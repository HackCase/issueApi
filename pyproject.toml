[project]
name = "core"
version = "0.1.0"
description = "Núcleo de IA: atas -> plano de ação -> issues"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "psycopg[binary,pool]",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["collector", "create_issues.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
